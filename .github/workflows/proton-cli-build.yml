name: proton-cli-build

on:
  push:
    branches:
      - "**"
    paths:
      - "proton-cli/**"
      - "proton-cli-web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: proton-cli/go.mod
          cache-dependency-path: proton-cli/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: proton-cli-web/package.json
          cache: npm
          cache-dependency-path: proton-cli-web/package-lock.json

      - name: Install proton-cli-web dependencies
        working-directory: proton-cli-web
        run: npm ci

      - name: Build proton-cli-web
        working-directory: proton-cli-web
        run: npm run release

      - name: Build proton-cli binaries
        working-directory: proton-cli
        env:
          PROTON_BUILD_PLATFORMS: linux/amd64 linux/arm64
        run: ./build/binaries

      - name: Upload proton-cli binaries
        uses: actions/upload-artifact@v7
        with:
          name: proton-cli-bins
          path: proton-cli/_output/local/bin
          if-no-files-found: error
